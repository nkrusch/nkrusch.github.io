name: nightly

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [ main ]
  workflow_dispatch:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    name: build
    if: ${{ vars.BUILD == 1 }}
    runs-on: ubuntu-latest
    steps:
      - uses: uses: actions/setup-node@v6
        with:
          node-version: latest
      - uses: actions/checkout@v6
        with:
          token:  ${{ secrets.PAT }}
          repository: ${{ vars.SOURCE_REPO }}
          ref: ${{ vars.SOURCE_BRANCH }}
      - uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-v3-${{ hashFiles('**/package-lock.json') }}
      - run: export SITE_URL=${{ vars.SITE_URL }} && cd site && npm ci && npm run build      
      - uses: actions/upload-artifact@v6
        with:
          name: website
          path: site/out

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/download-artifact@v7
        with:
          name: website
          path: ${{ vars.OUTPUT_PATH }}
      - name: 💅 Custom touches
        run: | 
          rm -rf .github
          touch .nojekyll
      - name: 🚀 Commit
        run: |  
          git config user.name "GitHub Actions"
          git config user.email "<>"
          git checkout --orphan newBranch
          git add -A
          git commit -m "Update website"
          if [ `git rev-parse --verify ${{ vars.OUTPUT_BRANCH }} 2>/dev/null` ]
          then
            git branch -D ${{ vars.OUTPUT_BRANCH }}
          fi          
          git branch -m ${{ vars.OUTPUT_BRANCH }}
          git push -f origin ${{ vars.OUTPUT_BRANCH }}
          git gc --aggressive --prune=all
